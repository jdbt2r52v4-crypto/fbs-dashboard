const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(){
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try{
    const pwd = document.getElementById('pwd').value;
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(DATA.salt), iterations:300000, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(DATA.iv)}, key, b(DATA.ct));
    document.open(); document.write(new TextDecoder().decode(pt)); document.close();
  }catch(e){
    err.textContent = 'Неверный пароль';
    btn.disabled = false;
  }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pwd').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });
</script></body></html>
